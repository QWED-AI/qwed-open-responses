sonar.projectKey=QWED-AI_qwed-open-responses
sonar.organization=qwed-ai

sonar.sources=src/qwed_open_responses
sonar.tests=tests

sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.10,3.11,3.12

# Disable JRE auto-provisioning to avoid 403 errors from SonarCloud API
# when querying JRE metadata from GitHub Actions runners.
# The runner's pre-installed Java is used instead.
sonar.scanner.skipJreProvisioning=true
